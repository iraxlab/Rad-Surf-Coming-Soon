<html>
<head>

<body>
<x-dc>
<helmet><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;600;700;800&amp;display=swap"><style>
button,a{-webkit-tap-highlight-color:transparent}
button:not(:disabled),a[style*="border-radius:999px"],a[style*="border-radius: 999px"]{transition:transform .18s cubic-bezier(.3,1.6,.5,1),box-shadow .18s,background .2s,color .2s}
button:not(:disabled):active,a[style*="border-radius:999px"]:active,a[style*="border-radius: 999px"]:active{transform:scale(.92) translateY(1px) !important;box-shadow:0 4px 10px -6px rgba(8,47,73,.6) !important;transition-duration:.07s !important}

</style>
</helmet>
<div style="font-family:'Instrument Sans',system-ui,sans-serif;color:#EEFAFB;position:relative;width:100%;aspect-ratio:16/8;min-height:300px;border-radius:28px;overflow:hidden;box-shadow:0 40px 80px -40px rgba(0,0,0,.7);border:1.5px solid rgba(125,199,219,.35);touch-action:manipulation;cursor:pointer">

    <div style="position:absolute;top:16px;left:18px;right:18px;display:flex;justify-content:space-between;align-items:center;pointer-events:none;font-weight:800;font-size:clamp(16px,1.6vw,20px);color:#082f49">
      <span style="background:rgba(238,250,251,.85);padding:8px 16px;border-radius:999px">Score <span ref="{{ scoreEl }}">0</span></span>
      <span ref="{{ livesEl }}" style="background:rgba(238,250,251,.85);padding:8px 16px;border-radius:999px;color:#e8505b;letter-spacing:.1em">♥♥♥</span>
      <span style="background:rgba(255,196,107,.92);padding:8px 16px;border-radius:999px">Best <span ref="{{ bestEl }}">0</span></span>
    </div>
    <div ref="{{ overlay }}" style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;pointer-events:none;text-align:center;background:rgba(8,47,73,.38);transition:opacity .25s">

      <span ref="{{ ovSub }}" style="font-weight:600;font-size:clamp(16px,1.5vw,20px);color:#EEFAFB;background:rgba(8,47,73,.55);padding:8px 16px;border-radius:999px">Tap anywhere on the wave to start · Computer: press Space</span>
      <div ref="{{ howTo }}" style="display:flex;flex-wrap:wrap;justify-content:center;gap:8px;max-width:92%;margin-top:4px">
        <span style="background:#EEFAFB;color:#082f49;font-weight:800;font-size:clamp(13px,1.3vw,17px);padding:8px 14px;border-radius:999px">👆 Tap = Jump</span>
        <span style="background:#EEFAFB;color:#082f49;font-weight:800;font-size:clamp(13px,1.3vw,17px);padding:8px 14px;border-radius:999px">👆👆 Tap again in air = Double jump</span>
        <span style="background:#ffc46b;color:#082f49;font-weight:800;font-size:clamp(13px,1.3vw,17px);padding:8px 14px;border-radius:999px">🐚 Grab gold shells = +2</span>
        <span style="background:#EEFAFB;color:#082f49;font-weight:800;font-size:clamp(13px,1.3vw,17px);padding:8px 14px;border-radius:999px">🦈 Dodge fins, rocks &amp; buoys</span>
        <span style="background:#EEFAFB;color:#e8505b;font-weight:800;font-size:clamp(13px,1.3vw,17px);padding:8px 14px;border-radius:999px">♥♥♥ 3 lives</span>
      </div>
    </div>
    <button ref="{{ shareBtn }}" onClick="{{ share }}" style="display:none;position:absolute;left:50%;bottom:22px;transform:translateX(-50%);border:0;cursor:pointer;background:#ffc46b;color:#082f49;font-family:'Instrument Sans',system-ui,sans-serif;font-weight:800;font-size:16px;letter-spacing:.04em;padding:14px 24px;border-radius:999px;box-shadow:0 14px 30px -12px rgba(0,0,0,.55);white-space:nowrap">📸 Share my score</button>
  </div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1000,"height":520}}'>

  hearts() { if (this.livesEl.current) this.livesEl.current.textContent = '♥'.repeat(Math.max(0, this.lives)) + '♡'.repeat(Math.max(0, 3 - this.lives)); }

    x.fillStyle = '#14567a'; x.beginPath(); x.moveTo(0, SH); for (let px = 0; px <= W; px += 6) x.lineTo(px, top(px)); x.lineTo(W, SH); x.fill();

    x.fillStyle = 'rgba(255,255,255,.9)'; for (let k = 0; k < 40; k++) { const px = 380 + Math.random() * 220, py = top(px) - Math.random() * 60; x.beginPath(); x.arc(px, py, 3 + Math.random() * 5, 0, 6.283); x.fill(); }

    x.fillStyle = '#EEFAFB'; x.font = F(800, 38); x.fillText('theradsurf.com', 72, H - 44);
    x.textAlign = 'right'; x.fillStyle = '#ffc46b'; x.font = F(700, 32); x.fillText('@radsurfnoflo', W - 72, H - 46);

      try { await navigator.clipboard.writeText(cap); this.toast('Caption copied! Just paste it in your post 📋'); } catch (e) {}

  draw(t) {

    const sun = x.createRadialGradient(w * 0.8, h * 0.28, 4, w * 0.8, h * 0.28, h * 0.32); sun.addColorStop(0, 'rgba(255,246,223,1)'); sun.addColorStop(0.22, 'rgba(255,230,170,.95)'); sun.addColorStop(0.23, 'rgba(255,220,150,.4)'); sun.addColorStop(1, 'rgba(255,220,150,0)');

      if (o.k === 'fin') { x.fillStyle = '#495d6e'; x.beginPath(); x.moveTo(o.x - 20 * sc, oy + 4); x.quadraticCurveTo(o.x - 2 * sc, oy - 46 * sc, o.x + 16 * sc, oy - 40 * sc); x.quadraticCurveTo(o.x + 6 * sc, oy - 20 * sc, o.x + 14 * sc, oy + 4); x.fill(); }
      else if (o.k === 'rock') { x.fillStyle = '#5f6b73'; x.beginPath(); x.ellipse(o.x, oy + 4, 26 * sc, 30 * sc, 0, Math.PI, 0); x.fill(); x.fillStyle = 'rgba(255,255,255,.25)'; x.beginPath(); x.ellipse(o.x - 8 * sc, oy - 12 * sc, 8 * sc, 5 * sc, -0.4, 0, 6.283); x.fill(); }
      else { const bob = Math.sin(t * 3 + o.x) * 3; x.fillStyle = '#ff7a59'; x.fillRect(o.x - 12 * sc, oy - 40 * sc + bob, 24 * sc, 40 * sc); x.fillStyle = '#EEFAFB'; x.fillRect(o.x - 12 * sc, oy - 26 * sc + bob, 24 * sc, 10 * sc); }
    }
    x.fillStyle = '#14567a'; x.beginPath(); x.moveTo(0, h); for (let px = 0; px <= w; px += 6) x.lineTo(px, wv(px)); x.lineTo(w, h); x.fill();
    x.strokeStyle = 'rgba(238,250,251,.85)'; x.lineWidth = 3; x.beginPath(); for (let px = 0; px <= w; px += 6) { const py = wv(px); px ? x.lineTo(px, py) : x.moveTo(px, py); } x.stroke();
    const deep = x.createLinearGradient(0, h * 0.7, 0, h); deep.addColorStop(0, 'rgba(8,47,73,0)'); deep.addColorStop(1, 'rgba(8,47,73,.7)'); x.fillStyle = deep; x.fillRect(0, h * 0.7, w, h * 0.3);
    for (const it of this.items) { const iy = wv(it.x) - it.hgt * sc + Math.sin(t * 3 + it.ph) * 5 * sc, r = 11 * sc; const gl = x.createRadialGradient(it.x, iy, 1, it.x, iy, r * 2.4); gl.addColorStop(0, 'rgba(255,214,120,.65)'); gl.addColorStop(1, 'rgba(255,214,120,0)'); x.fillStyle = gl; x.beginPath(); x.arc(it.x, iy, r * 2.4, 0, 6.283); x.fill(); x.fillStyle = '#ffc46b'; x.beginPath(); x.moveTo(it.x - r, iy + r * 0.6); for (let k = 0; k <= 6; k++) { const a = Math.PI + k * Math.PI / 6; x.lineTo(it.x + Math.cos(a) * r * 1.1, iy + r * 0.6 + Math.sin(a) * r * 1.4); } x.closePath(); x.fill(); x.strokeStyle = '#c98a2b'; x.lineWidth = 1.4; for (let k = 1; k < 6; k++) { const a = Math.PI + k * Math.PI / 6; x.beginPath(); x.moveTo(it.x, iy + r * 0.6); x.lineTo(it.x + Math.cos(a) * r, iy + r * 0.6 + Math.sin(a) * r * 1.3); x.stroke(); } }

    x.save(); if (this.inv > 0 && this.mode === 'play' && Math.floor(t * 12) % 2) x.globalAlpha = 0.35; x.translate(sx, gy + this.y * sc); x.rotate(crashed ? 1.2 : slope * 0.6 + (this.y < 0 ? Math.max(-0.35, this.vy / 3000) : 0));
    if (this.surfer.complete && this.surfer.naturalWidth) { const ih = 100 * sc, iw = ih * this.surfer.naturalWidth / this.surfer.naturalHeight; x.drawImage(this.surfer, -iw * 0.42, -ih * 0.9, iw, ih); }

    x.restore();
    x.fillStyle = 'rgba(255,255,255,.9)';
    for (const p of this.spray) { x.globalAlpha = Math.max(0, p.l / 0.6); x.beginPath(); x.arc(sx - 30 * sc + p.x, gy + p.y, 3, 0, 6.283); x.fill(); }

    x.textAlign = 'center'; x.font = '800 ' + Math.round(26 * sc) + 'px "Instrument Sans", system-ui, sans-serif';
    this.pops.forEach((p, idx) => { const k = 1 - p.l / 1.1; x.globalAlpha = Math.min(1, p.l * 2); x.lineWidth = 5; x.strokeStyle = 'rgba(8,47,73,.6)'; const py = gy + this.y * sc - 130 * sc - k * 50 * sc - (this.pops.length - 1 - idx) * 36 * sc; x.strokeText(p.t, sx + 20 * sc, py); x.fillStyle = p.col; x.fillText(p.t, sx + 20 * sc, py); });
    x.globalAlpha = 1; x.textAlign = 'left';
  }

  renderVals() {
    return { howTo: this.howTo, share: e => { e.stopPropagation(); this.shareScore(); }, shareBtn: this.shareBtn, livesEl: this.livesEl, cv: this.cv, scoreEl: this.scoreEl, bestEl: this.bestEl, overlay: this.overlay, ovTitle: this.ovTitle, ovSub: this.ovSub };
  }
